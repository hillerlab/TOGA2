name: TOGA2 CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            make \
            wget \
            curl \
            git \
            bash \
            pkg-config \
            libhdf5-dev \
            python3-dev \
            python3-pip \
            python3-venv

      - name: Set up Rust
        run: |
          set -euxo pipefail

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

      - name: Check gcc version
        run: |
          set -euxo pipefail

          gcc --version
          g++ --version

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
            bed2gtf/target
            postoga/rustools/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/assets/requirements/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Set executable permissions
        run: |
          set -euxo pipefail

          chmod +x check_dependencies.py
          chmod +x toga2.py
          chmod +x src/python/*.py
          chmod +x src/python/modules/*.py

      - name: Create toga2 venv and install Python dependencies
        run: |
          set -euxo pipefail

          rm -rf toga2
          python -m venv toga2
          source toga2/bin/activate

          python -VV
          which python
          python -c "import sys, sysconfig, platform; print(sys.executable); print(sysconfig.get_platform()); print(platform.machine())"

          python -m pip install --upgrade pip setuptools wheel maturin
          python -m pip install -r assets/requirements/requirements.txt

      - name: Install third-party dependencies
        run: |
          set -euxo pipefail

          source toga2/bin/activate
          python check_dependencies.py install_third_party

      - name: Build and install postoga rustools
        run: |
          set -euxo pipefail

          source toga2/bin/activate
          source "$HOME/.cargo/env"

          cd postoga/rustools

          python -m pip install --upgrade maturin

          env | sort | grep -E 'CARGO|PYO3|PYTHON|VIRTUAL_ENV' || true

          PYO3_PYTHON="$(which python)" python -m maturin develop --release

          cd ../..

          ./postoga/postoga.py -h

      - name: Install UCSC binaries
        run: |
          set -euxo pipefail

          source toga2/bin/activate
          make install_binaries

      - name: Build C components
        run: |
          set -euxo pipefail

          source toga2/bin/activate
          make build_c

      - name: Build Cython components
        run: |
          set -euxo pipefail

          source toga2/bin/activate

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r assets/requirements/requirements.txt

          make build_cython

      - name: Build Rust components
        run: |
          set -euxo pipefail

          source toga2/bin/activate
          source "$HOME/.cargo/env"

          make build_rust

      - name: Build CESAR2.0
        run: |
          set -euxo pipefail

          source toga2/bin/activate
          make build_cesar

      - name: Train models in toga2 venv
        run: |
          set -euxo pipefail

          source toga2/bin/activate
          make train_models

      - name: Final integration test
        run: |
          set -euxo pipefail

          source toga2/bin/activate

          ./toga2.py -h
          ./postoga/postoga.py -h

      - name: Verify build artifacts
        run: |
          set -euxo pipefail

          echo "Checking if binaries exist:"
          ls -la bin/

          echo "Checking if shared libraries exist:"
          ls -la src/python/modules/*.so

          echo "Checking if Rust binaries exist:"
          ls -la src/rust/target/release/
          ls -la bed2gtf/target/release/

          echo "Checking postoga rustools artifacts:"
          ls -la postoga/rustools/target/release/ || true
